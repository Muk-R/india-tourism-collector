name: Deploy tourism Worker

on:
  push:
    branches: [dev/session-a-hyderabad, dev/session-b-multicity, dev/session-c-enrichment]
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'worker/package.json'
      - 'worker/pnpm-lock.yaml'
      - 'worker/tsconfig.json'
      - 'worker/wrangler.toml'
      - 'supabase/schema.sql'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/deploy-tourism-worker.yml'
  pull_request:
    branches: [dev/session-a-hyderabad, dev/session-b-multicity, dev/session-c-enrichment]
    paths:
      - 'worker/**'
      - 'supabase/schema.sql'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'contracts/openapi.yaml'
      - '.github/workflows/deploy-tourism-worker.yml'
  workflow_dispatch:
    inputs:
      recovery_release:
        description: 'Use the separately authorized recovery path when the current live API preflight is unhealthy.'
        type: boolean
        required: true
        default: false
      recovery_reason:
        description: 'Incident/change reference for the protected recovery deployment.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: tourism-worker-pilot
  cancel-in-progress: false

jobs:
  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_DB: localise_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localise-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d localise_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: localise_ci
      PGUSER: postgres
      PGPASSWORD: localise-ci-only-password
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated Supabase-compatible roles and schemas
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create role supabase_realtime_admin nologin;
          create role authenticator login noinherit;
          grant anon, authenticated, service_role to authenticator;
          create schema auth;
          create schema storage;
          create extension if not exists pgcrypto;
          create extension if not exists postgis;
          SQL
      - name: Verify PostgreSQL and PostGIS versions
        run: psql -v ON_ERROR_STOP=1 -c "select current_setting('server_version'), postgis_full_version()"
      - name: Apply schema baseline and every additive migration in order
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          migration_order=(
            supabase/migrations/20261124_collection_cycles.sql
            supabase/migrations/20261125_offline_pbf_staging.sql
            supabase/migrations/20261126_route_readiness.sql
            supabase/migrations/20261127_public_places_api_compat.sql
            supabase/migrations/20261128_offline_pbf_publication.sql
            supabase/migrations/20261126143000_offline_pbf_attribution_encoding_repair.sql
            supabase/migrations/20261126150000_offline_pbf_wikidata_reconciliation.sql
            supabase/migrations/20261126164621_heritage_card_content_20261126.sql
            supabase/migrations/20261126180000_heritage_fee_encoding.sql
            supabase/migrations/20261129_tourism_taxonomy.sql
          )
          mapfile -t actual_migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          if [[ "${#actual_migrations[@]}" -ne "${#migration_order[@]}" ]]; then
            echo 'Migration inventory changed; update the reviewed dependency order.' >&2
            exit 1
          fi
          for migration in "${migration_order[@]}"; do
            if [[ ! -f "$migration" ]]; then echo "Missing reviewed migration: $migration" >&2; exit 1; fi
            if [[ "$migration" == 'supabase/migrations/20261126164621_heritage_card_content_20261126.sql' ]]; then
              psql -v ON_ERROR_STOP=1 -f supabase/tests/heritage_content_fixtures.sql
            fi
            echo "Applying isolated migration: $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify private staging RLS and taxonomy publication trigger
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/offline_pbf_staging.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/tourism_taxonomy.sql

  verify:
    needs: database-migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Confirm API origin targets the Worker in Wrangler configuration
        env:
          API_ORIGIN: ${{ vars.TOURISM_API_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = readFileSync('wrangler.toml', 'utf8');
          const workerName = config.match(/^name\s*=\s*"([a-z0-9_-]+)"/m)?.[1];
          if (!workerName) throw new Error('Could not determine the Worker name from wrangler.toml');
          const origin = new URL(process.env.API_ORIGIN || `https://${workerName}.promoacc123123.workers.dev`);
          if (origin.protocol !== 'https:') throw new Error('TOURISM_API_ORIGIN must use HTTPS');
          if (origin.hostname.endsWith('.workers.dev') && origin.hostname !== `${workerName}.promoacc123123.workers.dev`) {
            throw new Error(`TOURISM_API_ORIGIN targets a different Worker than wrangler.toml (${workerName}); update the Actions variable before deployment`);
          }
          console.log(`Worker target and API origin agree: ${workerName}`);
          NODE
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/deploy-check
      - name: Check the current public API before uploading a new version
        if: (github.event_name == 'push' && github.ref == 'refs/heads/dev/session-a-hyderabad') || (github.event_name == 'workflow_dispatch' && inputs.recovery_release != true)
        env:
          API_ORIGIN: ${{ vars.TOURISM_API_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const workerName = readFileSync('wrangler.toml','utf8').match(/^name\s*=\s*"([a-z0-9_-]+)"/m)?.[1];
          const base = process.env.API_ORIGIN || `https://${workerName}.promoacc123123.workers.dev`;
          const get = async (path) => {
            const response = await fetch(new URL(path,base),{signal:AbortSignal.timeout(15000),cache:'no-store'});
            let body = null;
            try { body = await response.json(); } catch { /* Report status and shape only. */ }
            return { status: response.status, body };
          };
          const [health, cities] = await Promise.all([get('/health'), get('/public/cities')]);
          const hyderabad = Array.isArray(cities.body) ? cities.body.find((city) => String(city?.name).toLowerCase() === 'hyderabad') : null;
          const cityId = typeof hyderabad?.id === 'string' ? hyderabad.id : 'c06387bf-0721-4c0f-9374-1cc641b4d106';
          const places = await get(`/public/places?city_id=${encodeURIComponent(cityId)}&limit=1`);
          const shape = (body) => Array.isArray(body) ? 'array' : body && typeof body === 'object' ? 'object' : typeof body;
          console.log(JSON.stringify({ health: { status: health.status, shape: shape(health.body) }, cities: { status: cities.status, shape: shape(cities.body) }, places: { status: places.status, shape: shape(places.body) } }));
          if (health.status !== 200 || health.body?.ok !== true) throw new Error('Current Worker health check failed; refusing deployment');
          if (cities.status !== 200 || !hyderabad) {
            throw new Error(`Current /public/cities returned HTTP ${cities.status}; refusing deployment`);
          }
          if (places.status !== 200 || !Array.isArray(places.body)) {
            throw new Error(`Current /public/places returned HTTP ${places.status}; refusing deployment`);
          }
          console.log('Current public Worker API is healthy; deployment may proceed');
          NODE

  deploy:
    if: >-
      (github.ref == 'refs/heads/dev/session-a-hyderabad' &&
        (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (inputs.recovery_release == true || needs.verify.result == 'success')))) ||
      (github.event_name == 'workflow_dispatch' && inputs.recovery_release == true &&
        startsWith(inputs.recovery_reason, 'diagnostic-only:') && needs.verify.result == 'success')
    needs: verify
    runs-on: ubuntu-latest
    environment: hyderabad-pilot
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - name: Confirm separately authorized recovery request
        id: recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_release == true
        env:
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
        run: |
          if [[ -z "${RECOVERY_REASON//[[:space:]]/}" ]]; then
            echo 'Recovery dispatch requires a non-empty incident/change reference.' >&2
            exit 1
          fi
          if [[ "$RECOVERY_REASON" == diagnostic-only:* ]]; then
            echo 'diagnostic_only=true' >> "$GITHUB_OUTPUT"
          else
            echo 'diagnostic_only=false' >> "$GITHUB_OUTPUT"
          fi
          echo 'Recovery mode selected; existing hyderabad-pilot environment approval remains required.'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Start diagnostic log capture before deployment
        id: diagnostic_tail
        if: steps.recovery.outputs.diagnostic_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          log_file="$RUNNER_TEMP/localise-worker-tail.jsonl"
          pnpm exec wrangler tail --format json --search tourism_db_stage > "$log_file" 2>&1 &
          tail_pid=$!
          echo "TAIL_PID=$tail_pid" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_LOG_FILE=$log_file" >> "$GITHUB_ENV"
          for attempt in {1..10}; do
            if ! kill -0 "$tail_pid" 2>/dev/null; then
              echo 'Wrangler tail did not remain connected; refusing diagnostic deployment.' >&2
              exit 1
            fi
            sleep 1
          done
          echo 'Sanitized database-stage log capture is connected before deployment.'
      - name: Deploy to the existing tourism pilot Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DIAGNOSTIC_ONLY: ${{ steps.recovery.outputs.diagnostic_only }}
        run: |
          if [[ "$DIAGNOSTIC_ONLY" == "true" ]]; then
            pnpm exec wrangler deploy --keep-vars \
              --var ADMIN_ACTOR_ID:localise-pilot-admin \
              --var DB_DIAGNOSTICS:true \
              --var SUPABASE_PROJECT_REF:vsfbwesxskkveaevujnj \
              --message "Temporary database diagnostics $GITHUB_SHA"
          else
            pnpm exec wrangler deploy --keep-vars --var ADMIN_ACTOR_ID:localise-pilot-admin --message "GitHub Actions $GITHUB_SHA"
          fi
      - name: Request public cities once and record response shape only
        id: diagnostic_request
        if: steps.recovery.outputs.diagnostic_only == 'true' && steps.deploy.outcome == 'success'
        env:
          API_ORIGIN: ${{ vars.TOURISM_API_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_ORIGIN || 'https://india-tourism-collector.promoacc123123.workers.dev';
          const response = await fetch(new URL('/public/cities', base), {
            method: 'GET', cache: 'no-store', signal: AbortSignal.timeout(15000),
          });
          let body;
          try { body = await response.json(); } catch { body = undefined; }
          const shape = Array.isArray(body) ? 'array' : body && typeof body === 'object' ? 'object' : typeof body;
          console.log(JSON.stringify({ request: 'GET /public/cities', status: response.status, shape, ray_id: response.headers.get('cf-ray') || null }));
          NODE
      - name: Stop tail and print only sanitized database diagnostic fields
        if: always() && steps.recovery.outputs.diagnostic_only == 'true'
        run: |
          if [[ -n "${TAIL_PID:-}" ]]; then kill "$TAIL_PID" 2>/dev/null || true; fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const path = process.env.DIAGNOSTIC_LOG_FILE;
          const allowedStages = new Set(['bindings','url_validation','credential_format','fetch_start','fetch_exception','upstream_response','response_parse_failure','configuration_failure','request_failure']);
          const safe = [];
          for (const line of readFileSync(path, 'utf8').split(/\r?\n/)) {
            let event;
            try { event = JSON.parse(line); } catch { continue; }
            for (const log of event?.logs || []) {
              const message = log?.message;
              if (!Array.isArray(message) || message[0] !== 'tourism_db_stage' || !message[1] || typeof message[1] !== 'object') continue;
              const item = message[1];
              if (!allowedStages.has(item.stage)) continue;
              const row = { request_id: typeof item.request_id === 'string' ? item.request_id : null, operation: ['public_cities','public_places'].includes(item.operation) ? item.operation : null, stage: item.stage };
              for (const key of ['supabase_url_present','supabase_secret_key_present','valid','project_match','expected_project_ref_configured','format_valid']) if (typeof item[key] === 'boolean') row[key] = item[key];
              if (item.stage === 'credential_format' && typeof item.kind === 'string' && ['sb_secret','legacy_jwt','other','missing'].includes(item.kind)) row.kind = item.kind;
              if (item.stage === 'fetch_start' && typeof item.method === 'string' && ['GET','POST','PUT','PATCH','DELETE'].includes(item.method)) row.method = item.method;
              if (item.stage === 'fetch_start' && item.upstream === 'supabase_rest') row.upstream = item.upstream;
              if (typeof item.category === 'string' && ['success','http_error','timeout','dns','connection','tls','fetch_type_error','network_exception','unknown_exception','invalid_url','invalid_expected_project_ref','project_mismatch','required_binding_missing','invalid_json'].includes(item.category)) row.category = item.category;
              if (Number.isInteger(item.status) && item.status >= 100 && item.status <= 599) row.status = item.status;
              if (typeof item.code === 'string' && /^[A-Z0-9]{4,16}$/.test(item.code)) row.code = item.code;
              safe.push(row);
            }
          }
          if (!safe.length) console.log('No structured database diagnostic stage events were captured.');
          else for (const row of safe) console.log(JSON.stringify(row));
          NODE
      - name: Roll back temporary diagnostic deployment
        if: always() && steps.recovery.outputs.diagnostic_only == 'true' && steps.deploy.outcome == 'success'
        run: pnpm exec wrangler rollback --message "Rollback after temporary database diagnostic capture"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live Worker API
        id: health
        if: steps.recovery.outputs.diagnostic_only != 'true'
        env:
          API_ORIGIN: ${{ vars.TOURISM_API_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_ORIGIN || 'https://india-tourism-collector.promoacc123123.workers.dev';
          if (new URL(base).protocol !== 'https:') throw new Error('TOURISM_API_ORIGIN must use HTTPS');
          const get = async (path) => {
            const response = await fetch(new URL(path, base), { signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            return response.json();
          };
          const health = await get('/health');
          if (health?.ok !== true || typeof health?.service !== 'string') throw new Error('/health response shape is invalid');
          const cities = await get('/public/cities');
          if (!Array.isArray(cities)) throw new Error('/public/cities must return a JSON array');
          if (cities.some((city) => !city || typeof city.id !== 'string' || typeof city.name !== 'string')) throw new Error('/public/cities contains an invalid city shape');
          const hyderabad = cities.find((city) => city.name.toLowerCase() === 'hyderabad');
          if (!hyderabad) throw new Error('Hyderabad is not enabled in the tourism API');
          const places = [];
          for (let offset = 0; offset <= 10000; offset += 100) {
            const query = new URLSearchParams({ city_id: hyderabad.id, limit: '100', offset: String(offset) });
            const page = await get(`/public/places?${query}`);
            if (!Array.isArray(page)) throw new Error('/public/places must return a JSON array');
            places.push(...page);
            if (page.length < 100) break;
            if (offset === 10000) throw new Error('Public places pagination exceeded its safety bound');
          }
          const identities = new Set();
          const categories = new Set();
          for (const row of places) {
            const place = row?.place;
            if (!place || place.review_status !== 'approved') throw new Error('/public/places returned an invalid or unapproved record');
            if (identities.has(place.id)) throw new Error('Public pagination returned duplicate place IDs');
            identities.add(place.id);
            if (!Array.isArray(place.sources) || !place.sources.length || place.sources.some((source) => !source.attribution || !source.license || !/^https?:\/\//.test(source.source_url || '') || Object.hasOwn(source, 'payload'))) throw new Error('/public/places contains missing attribution or private source payload');
            if (place.taxonomy_categories) for (const category of place.taxonomy_categories) categories.add(category);
            if (place.route_ready === true && (place.is_active !== true || !Number.isFinite(place.latitude) || !Number.isFinite(place.longitude))) throw new Error('Route-ready place lacks approved active coordinates');
            if (place.route_ready !== true && place.route_ready !== false) throw new Error('route_ready must be an explicit boolean');
          }
          console.log(`Worker health passed; cities=${cities.length}; Hyderabad public rows=${places.length}; categories=${categories.size}`);
          NODE
      - name: Roll back failed deployment
        if: failure() && steps.recovery.outputs.diagnostic_only != 'true' && steps.health.outcome == 'failure'
        run: pnpm exec wrangler rollback --message "Automatic rollback after failed pilot health check"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
