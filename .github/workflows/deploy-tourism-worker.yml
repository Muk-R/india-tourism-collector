name: Deploy tourism Worker

on:
  push:
    branches: [dev/session-a-hyderabad, dev/session-b-multicity, dev/session-c-enrichment]
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'worker/package.json'
      - 'worker/pnpm-lock.yaml'
      - 'worker/tsconfig.json'
      - 'worker/wrangler.toml'
      - 'supabase/schema.sql'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/deploy-tourism-worker.yml'
  pull_request:
    branches: [dev/session-a-hyderabad, dev/session-b-multicity, dev/session-c-enrichment]
    paths:
      - 'worker/**'
      - 'supabase/schema.sql'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'contracts/openapi.yaml'
      - '.github/workflows/deploy-tourism-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tourism-worker-pilot
  cancel-in-progress: false

jobs:
  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_DB: localise_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localise-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d localise_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: localise_ci
      PGUSER: postgres
      PGPASSWORD: localise-ci-only-password
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated Supabase-compatible roles and schemas
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create role supabase_realtime_admin nologin;
          create role authenticator login noinherit;
          grant anon, authenticated, service_role to authenticator;
          create schema auth;
          create schema storage;
          create extension if not exists pgcrypto;
          create extension if not exists postgis;
          SQL
      - name: Verify PostgreSQL and PostGIS versions
        run: psql -v ON_ERROR_STOP=1 -c "select current_setting('server_version'), postgis_full_version()"
      - name: Apply schema baseline and every additive migration in order
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          migration_order=(
            supabase/migrations/20261124_collection_cycles.sql
            supabase/migrations/20261125_offline_pbf_staging.sql
            supabase/migrations/20261126_route_readiness.sql
            supabase/migrations/20261127_public_places_api_compat.sql
            supabase/migrations/20261128_offline_pbf_publication.sql
            supabase/migrations/20261126143000_offline_pbf_attribution_encoding_repair.sql
            supabase/migrations/20261126150000_offline_pbf_wikidata_reconciliation.sql
            supabase/migrations/20261126164621_heritage_card_content_20261126.sql
            supabase/migrations/20261126180000_heritage_fee_encoding.sql
            supabase/migrations/20261129_tourism_taxonomy.sql
          )
          mapfile -t actual_migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          if [[ "${#actual_migrations[@]}" -ne "${#migration_order[@]}" ]]; then
            echo 'Migration inventory changed; update the reviewed dependency order.' >&2
            exit 1
          fi
          for migration in "${migration_order[@]}"; do
            if [[ ! -f "$migration" ]]; then echo "Missing reviewed migration: $migration" >&2; exit 1; fi
            if [[ "$migration" == 'supabase/migrations/20261126164621_heritage_card_content_20261126.sql' ]]; then
              psql -v ON_ERROR_STOP=1 -f supabase/tests/heritage_content_fixtures.sql
            fi
            echo "Applying isolated migration: $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify private staging RLS and taxonomy publication trigger
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/offline_pbf_staging.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/tourism_taxonomy.sql

  verify:
    needs: database-migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/deploy-check

  deploy:
    if: github.ref == 'refs/heads/dev/session-a-hyderabad' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: verify
    runs-on: ubuntu-latest
    environment: hyderabad-pilot
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Deploy to the existing tourism pilot Worker
        run: pnpm exec wrangler deploy --keep-vars --var ADMIN_ACTOR_ID:localise-pilot-admin --message "GitHub Actions $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live Worker API
        id: health
        env:
          API_ORIGIN: ${{ vars.TOURISM_API_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_ORIGIN || 'https://hyderabad-pilot-india-tourism-collector.promoacc123123.workers.dev';
          if (new URL(base).protocol !== 'https:') throw new Error('TOURISM_API_ORIGIN must use HTTPS');
          const get = async (path) => {
            const response = await fetch(new URL(path, base), { signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            return response.json();
          };
          const health = await get('/health');
          if (health?.ok !== true || typeof health?.service !== 'string') throw new Error('/health response shape is invalid');
          const cities = await get('/public/cities');
          if (!Array.isArray(cities)) throw new Error('/public/cities must return a JSON array');
          if (cities.some((city) => !city || typeof city.id !== 'string' || typeof city.name !== 'string')) throw new Error('/public/cities contains an invalid city shape');
          const hyderabad = cities.find((city) => city.name.toLowerCase() === 'hyderabad');
          if (!hyderabad) throw new Error('Hyderabad is not enabled in the tourism API');
          const places = [];
          for (let offset = 0; offset <= 10000; offset += 100) {
            const query = new URLSearchParams({ city_id: hyderabad.id, limit: '100', offset: String(offset) });
            const page = await get(`/public/places?${query}`);
            if (!Array.isArray(page)) throw new Error('/public/places must return a JSON array');
            places.push(...page);
            if (page.length < 100) break;
            if (offset === 10000) throw new Error('Public places pagination exceeded its safety bound');
          }
          const identities = new Set();
          const categories = new Set();
          for (const row of places) {
            const place = row?.place;
            if (!place || place.review_status !== 'approved') throw new Error('/public/places returned an invalid or unapproved record');
            if (identities.has(place.id)) throw new Error('Public pagination returned duplicate place IDs');
            identities.add(place.id);
            if (!Array.isArray(place.sources) || !place.sources.length || place.sources.some((source) => !source.attribution || !source.license || !/^https?:\/\//.test(source.source_url || '') || Object.hasOwn(source, 'payload'))) throw new Error('/public/places contains missing attribution or private source payload');
            if (place.taxonomy_categories) for (const category of place.taxonomy_categories) categories.add(category);
            if (place.route_ready === true && (place.is_active !== true || !Number.isFinite(place.latitude) || !Number.isFinite(place.longitude))) throw new Error('Route-ready place lacks approved active coordinates');
            if (place.route_ready !== true && place.route_ready !== false) throw new Error('route_ready must be an explicit boolean');
          }
          console.log(`Worker health passed; cities=${cities.length}; Hyderabad public rows=${places.length}; categories=${categories.size}`);
          NODE
      - name: Roll back failed deployment
        if: failure() && steps.health.outcome == 'failure'
        run: pnpm exec wrangler rollback --message "Automatic rollback after failed pilot health check"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
