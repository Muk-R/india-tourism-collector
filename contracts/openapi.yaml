openapi: 3.1.0
info:
  title: Localise Tourism API
  version: 0.1.0
  description: Existing Worker endpoints and separately marked planned Localise APIs.
servers:
  - url: https://{workerHost}
    description: Use the local Worker host during development.
    variables:
      workerHost:
        default: localhost:8787
tags:
  - name: Health
  - name: Public tourism
  - name: Admin
  - name: Planned Localise
paths:
  /health:
    get:
      tags: [Health]
      summary: Worker health check
      x-implementation-status: existing
      security: []
      responses:
        '200':
          description: Worker is responding.
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
  /public/cities:
    get:
      tags: [Public tourism]
      summary: List enabled cities ordered by name
      x-implementation-status: existing
      security: []
      responses:
        '200':
          description: Enabled cities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/City' }
  /public/places:
    get:
      tags: [Public tourism]
      summary: List approved active places for a city
      x-implementation-status: existing
      security: []
      parameters:
        - name: city_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: offset
          in: query
          description: Zero-based page offset; values above 100000 are rejected.
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200':
          description: Current city-place links ordered by relevance score.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CityPlace' }
        '400': { $ref: '#/components/responses/Error' }
  /admin/stats:
    get:
      tags: [Admin]
      summary: Counts for collection, queue, and review statuses
      x-implementation-status: existing
      security: [{ AdminBearer: [] }]
      responses:
        '200':
          description: Status counts for cities, places, runs, cycles, queues, and discovery. Counts are paged reads and may shift while collection is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/review:
    get:
      tags: [Admin]
      summary: List current place links for review
      x-implementation-status: existing
      security: [{ AdminBearer: [] }]
      parameters:
        - name: city_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected], default: pending }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Current links and source attribution.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReviewItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/review/{place_id}:
    post:
      tags: [Admin]
      summary: Approve or reject a pending place
      x-implementation-status: existing
      security: [{ AdminBearer: [] }]
      parameters:
        - name: place_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [review_status]
              properties:
                review_status: { type: string, enum: [approved, rejected] }
      responses:
        '200': { description: Updated place record. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Place is absent or no longer pending. }
  /admin/import-offline-pbf:
    post:
      tags: [Admin]
      summary: Import a bounded offline OSM PBF snapshot batch into private review staging
      x-implementation-status: existing
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id, source_snapshot, source_checksum, expected_total, records]
              properties:
                snapshot_id: { type: string, minLength: 16, maxLength: 160 }
                source_snapshot: { type: string, maxLength: 128 }
                source_checksum: { type: string, pattern: '^[0-9a-f]{64}$' }
                expected_total: { type: integer, minimum: 1, maximum: 100000 }
                records: { type: array, minItems: 1, maxItems: 500, items: { type: object, additionalProperties: true } }
      responses:
        '200': { description: Batch inserted and already present counts. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Batch body exceeds the route limit. }
  /admin/import-offline-pbf/finalize:
    post:
      tags: [Admin]
      summary: Reconcile an offline OSM snapshot and make its staging import immutable
      x-implementation-status: existing
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id]
              properties:
                snapshot_id: { type: string, minLength: 16, maxLength: 160 }
      responses:
        '200': { description: Reconciled total, review-only, and quarantined record counts. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Snapshot is missing or incomplete. }
  /admin/promote-offline-pbf:
    post:
      tags: [Admin]
      summary: Publish explicitly approved browse-only records from a finalized private snapshot
      description: Requires the server-side ADMIN_ACTOR_ID binding. Place names and coordinates are read from private staging; request bodies cannot override them. Route and itinerary readiness are always false. The database RPC is service-role-only, transactional and idempotent.
      x-implementation-status: new
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key, snapshot_id, city_id, approval_reference, records]
              properties:
                idempotency_key: { type: string, minLength: 16, maxLength: 160, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{15,159}$' }
                snapshot_id: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                city_id: { type: string, format: uuid }
                approval_reference: { type: string, minLength: 8, maxLength: 200 }
                records:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [source_key, category, decision, importance_score, importance_rationale, importance_source_url]
                    properties:
                      source_key: { type: string, pattern: '^(node|way|relation)/[1-9][0-9]{0,18}$' }
                      category: { type: string, enum: [attraction, food, accommodation, transport] }
                      decision: { type: string, enum: [approve_browse_only] }
                      importance_score: { type: integer, minimum: 0, maximum: 100, description: Editorial ranking only; never a customer rating. }
                      importance_rationale: { type: string, minLength: 8, maxLength: 1000 }
                      importance_source_url: { type: string, format: uri, pattern: '^https://' }
                      historical_summary: { type: string, minLength: 20, maxLength: 3000 }
                      historical_summary_source_url: { type: string, format: uri, pattern: '^https://' }
                      historical_summary_license: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200': { description: Transactional publication counts and audit ID; repeat idempotency keys do not duplicate records. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Snapshot, approval, or source identity conflicts; no partial publication is committed. }
        '413': { description: Promotion body exceeds the route limit. }
        '502': { description: Tourism database unavailable. }
        '503': { description: Promotion audit actor is not configured. }
  /admin/rollback-offline-pbf-publication:
    post:
      tags: [Admin]
      summary: Roll back one audited publication batch without deleting place or audit rows
      x-implementation-status: new
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key, rollback_reference]
              properties:
                idempotency_key: { type: string, minLength: 16, maxLength: 160 }
                rollback_reference: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200': { description: Published rows are made inactive and their city links are retired; audit rows remain. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Publication is absent, already changed, or cannot be safely rolled back. }
        '503': { description: Promotion audit actor is not configured. }
  /admin/collect:
    post:
      tags: [Admin]
      summary: Claim and process the next due city collection cycle
      x-implementation-status: existing
      security: [{ AdminBearer: [] }]
      responses:
        '200':
          description: Collection outcome or idle response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/Error' }
  /admin/collect-city/{city_id}:
    post:
      tags: [Admin]
      summary: Claim or resume one city's collection cycle
      x-implementation-status: existing
      security: [{ AdminBearer: [] }]
      parameters:
        - name: city_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: radiusKm
          in: query
          description: Integer radius from 10 through 150 km; active cycles use their persisted radius.
          schema: { type: integer, minimum: 10, maximum: 150 }
        - name: rediscover
          in: query
          schema: { type: boolean, default: false }
        - name: confirmLegacyRadius
          in: query
          description: Explicit confirmation for an uncertain historical radius.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Collection cycle progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: City does not exist. }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /public/cities/{city_id}/summary:
    get:
      tags: [Planned Localise]
      summary: Historical context and famous landmarks for a city
      description: Planned only; no current Worker route implements this operation.
      x-implementation-status: planned
      security: []
      parameters:
        - name: city_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: City summary with source attribution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CitySummary' }
        '404': { $ref: '#/components/responses/Error' }
  /public/lodgings:
    get:
      tags: [Planned Localise]
      summary: Search accommodations by city, neighborhood, attraction, or corridor
      description: Planned only. Missing source evidence leaves ratings/classification unknown.
      x-implementation-status: planned
      security: []
      parameters:
        - { name: city_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: near_place_id, in: query, schema: { type: string, format: uuid } }
        - { name: corridor_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Planned lodging results.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Lodging' } }
  /public/restaurants:
    get:
      tags: [Planned Localise]
      summary: Search restaurants by city, neighborhood, attraction, or corridor
      description: Planned only. Dietary labels require supporting source evidence.
      x-implementation-status: planned
      security: []
      parameters:
        - { name: city_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: near_place_id, in: query, schema: { type: string, format: uuid } }
        - { name: corridor_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Planned restaurant results.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Restaurant' } }
  /public/itineraries/plan:
    post:
      tags: [Planned Localise]
      summary: Create a feasible itinerary proposal
      x-implementation-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItineraryRequest' }
      responses:
        '200':
          description: Itinerary and constraint notes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Itinerary' }
        '400': { $ref: '#/components/responses/Error' }
  /public/itineraries/{itinerary_id}/reschedule:
    post:
      tags: [Planned Localise]
      summary: Reschedule remaining itinerary activities after a delay
      x-implementation-status: planned
      security: []
      parameters:
        - { name: itinerary_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [delay_minutes]
              properties:
                delay_minutes: { type: integer, minimum: 1, maximum: 1440 }
                current_stop_id: { type: string, format: uuid }
      responses:
        '200':
          description: Recalculated remaining schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Itinerary' }
        '400': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      description: Existing admin routes use configured ADMIN_TOKEN. Never put its value in this file.
  responses:
    Error:
      description: Request or upstream error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Admin authentication failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    City:
      type: object
      required: [id, name, latitude, longitude, radius_km]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state_name: { type: [string, 'null'] }
        latitude: { type: number }
        longitude: { type: number }
        radius_km: { type: integer, minimum: 10, maximum: 150 }
    SourceAttribution:
      type: object
      properties:
        source_name: { type: string }
        source_id: { type: string }
        source_url: { type: [string, 'null'], format: uri }
        attribution: { type: [string, 'null'] }
        license: { type: [string, 'null'] }
        payload: {}
    Place:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        canonical_name: { type: string }
        category: { type: [string, 'null'] }
        subcategory: { type: [string, 'null'] }
        latitude: { type: number }
        longitude: { type: number }
        description: { type: [string, 'null'] }
        description_source: { type: [string, 'null'] }
        description_license: { type: [string, 'null'] }
        wikipedia_url: { type: [string, 'null'], format: uri }
        image_url: { type: [string, 'null'], format: uri }
        image_author: { type: [string, 'null'] }
        image_license: { type: [string, 'null'] }
        importance_score: { type: [number, 'null'] }
        quality_score: { type: [number, 'null'] }
        review_status: { type: string, enum: [pending, approved, rejected] }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceAttribution' }
    CityPlace:
      type: object
      required: [distance_km, place]
      properties:
        distance_km: { type: number }
        relevance_score: { type: [number, 'null'] }
        area_class:
          type: [string, 'null']
          enum: [core_hyderabad, nearby_escape_candidate, null]
          description: Present when validated PBF stage provenance supports the classification.
        place: { $ref: '#/components/schemas/Place' }
    ReviewItem:
      type: object
      properties:
        distance_km: { type: number }
        relevance_score: { type: [number, 'null'] }
        place: { $ref: '#/components/schemas/Place' }
    CollectionResult:
      type: object
      additionalProperties: true
      properties:
        city: { type: string }
        cycle_id: { type: string, format: uuid }
        radius_km: { type: integer, minimum: 10, maximum: 150 }
        status: { type: string }
        discovered: { type: object, additionalProperties: { type: integer } }
        processed: { type: integer }
        remaining: { type: integer }
        queue: { type: object, additionalProperties: { type: integer } }
        errors: { type: array, items: { type: string } }
        retired_links: { type: integer }
    StatusCounts:
      type: object
      additionalProperties: { type: integer, minimum: 0 }
    QueueStatusCounts:
      type: object
      required: [pending, processing, retryable, failed, completed, exhausted, superseded]
      properties:
        pending: { type: integer, minimum: 0 }
        processing: { type: integer, minimum: 0 }
        retryable: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        exhausted: { type: integer, minimum: 0 }
        superseded: { type: integer, minimum: 0 }
    AdminStats:
      type: object
      required: [cities, places, runs, cycles, queue, discovery, legacy_queue]
      properties:
        cities: { $ref: '#/components/schemas/StatusCounts' }
        places: { $ref: '#/components/schemas/StatusCounts' }
        runs: { $ref: '#/components/schemas/StatusCounts' }
        cycles: { $ref: '#/components/schemas/StatusCounts' }
        queue: { $ref: '#/components/schemas/QueueStatusCounts' }
        discovery: { $ref: '#/components/schemas/StatusCounts' }
        legacy_queue: { $ref: '#/components/schemas/StatusCounts' }
    CitySummary:
      type: object
      properties:
        city_id: { type: string, format: uuid }
        historical_significance: { type: [string, 'null'] }
        landmarks: { type: array, items: { $ref: '#/components/schemas/Place' } }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceAttribution' } }
    Lodging:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        budget_tier: { type: [string, 'null'], enum: [budget, mid_tier, premium, null] }
        star_rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        accommodation_type: { type: [string, 'null'] }
        rating_source: { type: [string, 'null'] }
    Restaurant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        dietary_classification: { type: [string, 'null'], enum: [vegetarian, non_vegetarian, unknown, null] }
        cuisine_types: { type: array, items: { type: string } }
        classification_source: { type: [string, 'null'] }
    ItineraryRequest:
      type: object
      required: [city_id, start_date, days]
      properties:
        city_id: { type: string, format: uuid }
        start_date: { type: string, format: date }
        days: { type: integer, minimum: 1, maximum: 21 }
        hotel_id: { type: [string, 'null'], format: uuid }
        selected_place_ids: { type: array, items: { type: string, format: uuid } }
        travel_mode: { type: string, enum: [driving, walking, transit], default: driving }
    Itinerary:
      type: object
      required: [status, days]
      properties:
        itinerary_id: { type: string, format: uuid }
        status: { type: string, enum: [proposed, feasible, partial, needs_review] }
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              activities:
                type: array
                items:
                  type: object
                  properties:
                    place_id: { type: [string, 'null'], format: uuid }
                    kind: { type: string, enum: [visit, breakfast, lunch, dinner, rest, travel] }
                    starts_at: { type: string, format: date-time }
                    ends_at: { type: string, format: date-time }
                    travel_minutes_from_previous: { type: [integer, 'null'], minimum: 0 }
                    constraint_notes: { type: array, items: { type: string } }
